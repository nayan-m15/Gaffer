# Self-hosted SonarQube (Community Edition) for this project.
#
# Usage (locally, or on whatever server you'll run the permanent instance on):
#   docker compose -f docker-compose.sonarqube.yml up -d
#   open http://localhost:9000  (default login: admin / admin, you'll be forced to change it)
#
# This is NOT wired into the app's own docker setup on purpose — SonarQube is
# CI/dev tooling, not something the app depends on at runtime.
#
# See docs/sonarqube.md for full setup instructions (token creation, project
# key, CI secrets, etc).

services:
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    depends_on:
      - sonarqube_db
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube_db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    restart: unless-stopped

  sonarqube_db:
    image: postgres:16-alpine
    container_name: sonarqube_db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_db_data:
