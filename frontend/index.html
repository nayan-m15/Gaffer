<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1218" />
    <title>Gaffer - The football coaching platform built for the touchline</title>
    <!-- Same stylesheet as React LoadingScreen — keeps Pre-Loader identical. -->
    <link rel="stylesheet" href="/loading-screen.css" />
    <script>
      /* ── Theme detection + background colour before first paint ──────────
       * Sets the "dark" class AND hardcoded background colours on <html>
       * and <body> so the very first frame the browser paints already has
       * the correct theme — no white flash, no dark-mode flash.
       * Uses hardcoded hex values because CSS custom properties from
       * index.css have not loaded at this point.                            */
      try {
        var t = localStorage.getItem("sport-coaching-theme");
        var d = t === "dark" || (!t && matchMedia("(prefers-color-scheme:dark)").matches);
        if (d) {
          document.documentElement.className = "dark";
          document.documentElement.style.background = "#0B1218";
        } else {
          document.documentElement.style.background = "#F5F3F0";
        }
      } catch(e) {
        document.documentElement.style.background = "#F5F3F0";
      }
    </script>
    <style>
      body { margin: 0; background: inherit; }
      /* Sit above React until handoff; shared .loading-overlay uses 9999. */
      #preloader { z-index: 99999; }
    </style>
  </head>
  <body>
    <!-- Pre-React preloader: same markup/classes as React <LoadingScreen>. -->
    <div
      id="preloader"
      class="loading-overlay"
      role="status"
      aria-label="Loading application"
      aria-busy="true"
    >
      <div class="loading-content">
        <img
          src="/logo.png"
          alt="GAFFER logo"
          width="56"
          height="56"
          class="loading-logo"
          draggable="false"
        />
        <span class="loading-brand">GAFFER</span>
        <div class="loading-dots" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
    <script>
      /* Theme tokens for /loading-screen.css — scoped to #preloader only so
         they do not override the app's :root / .dark variables after React. */
      (function () {
        var pre = document.getElementById("preloader");
        if (!pre) return;
        var isDark = document.documentElement.classList.contains("dark");
        pre.style.setProperty("--background", isDark ? "#0B1218" : "#F5F3F0");
        pre.style.setProperty("--foreground", isDark ? "#E8ECEF" : "#171717");
        pre.style.setProperty("--brand", isDark ? "#00D99A" : "#059669");
        pre.style.setProperty(
          "--font-display",
          '"Lyon", Georgia, "Times New Roman", serif',
        );
      })();
    </script>

    <!-- React root — hidden until the React LoadingScreen is mounted. -->
    <div id="root" style="display:none"></div>

    <script type="module" src="/src/main.tsx"></script>

    <!-- Seamless preloader → React handoff.
         Polls for React's .loading-overlay inside #root, then un-hides
         #root and removes #preloader on the next animation frame.
         A 15 s fallback ensures the page isn't stuck if JS fails.           -->
    <script>
      (function () {
        var pre = document.getElementById("preloader");
        var root = document.getElementById("root");
        if (!pre || !root) return;

        var done = false;

        function check() {
          if (done) return;
          if (root.querySelector(".loading-overlay")) {
            done = true;
            /* Double-rAF: first frame ensures the browser has committed
               React's paint; second frame swaps layers seamlessly. */
            requestAnimationFrame(function () {
              requestAnimationFrame(function () {
                root.style.display = "";
                pre.remove();
              });
            });
            return;
          }
          requestAnimationFrame(check);
        }
        requestAnimationFrame(check);

        /* Fallback: if React never mounts, reveal the root after 15 s. */
        setTimeout(function () {
          if (!done) {
            done = true;
            root.style.display = "";
            pre.remove();
          }
        }, 15000);
      })();
    </script>
  </body>
</html>
