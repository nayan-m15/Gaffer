name: Offline sync production health

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check queue and replication health
        env:
          OPERATIONS_HEALTH_URL: ${{ secrets.OPERATIONS_HEALTH_URL }}
          OPERATIONS_HEALTH_TOKEN: ${{ secrets.OPERATIONS_HEALTH_TOKEN }}
        run: node backend/scripts/check-offline-health.mjs
