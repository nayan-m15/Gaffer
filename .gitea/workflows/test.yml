name: Test

on:
  pull_request:
    branches: [main, develop, development]
  push:
    branches: [main, develop, development]

jobs:
  quality-and-build:
    name: Code quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix frontend ci
          npm --prefix backend ci

      - name: Lint
        run: npm run lint

      - name: Run frontend model tests
        run: npm --prefix frontend test

      - name: Build
        run: npm run build

  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Neon hosts resolve to several IPv4 and IPv6 addresses and Node gives
      # each only 250ms to connect; from the runners that abandons every IPv4
      # attempt and fails on unreachable IPv6 ("fetch failed"). Covers
      # migrations, Jest, the backend and Playwright in this job.
      NODE_OPTIONS: --network-family-autoselection-attempt-timeout=2500
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-do-not-use-outside-tests
      BETTER_AUTH_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:5173
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Run unit tests
        run: npm test

      - name: Run migration regression tests
        run: npm run test:migrations

      # Every job that touches a database gets its own throwaway one, created
      # next to the TEST_DATABASE_URL database. Runs from different branches
      # and PRs used to share that one database and reset or migrate it under
      # each other mid-run (backend/scripts/ci-test-database.mjs).
      - name: Provision isolated test database
        run: node backend/scripts/ci-test-database.mjs create api
        env:
          CI_TEST_DATABASE_BASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      - name: Run integration tests
        run: npm run test:integration

      - name: Drop isolated test database
        if: always()
        run: node backend/scripts/ci-test-database.mjs drop
        env:
          CI_TEST_DATABASE_BASE_URL: ${{ secrets.TEST_DATABASE_URL }}

  sonarqube:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    needs: api-tests
    # SonarQube Community Edition only analyses a single branch and doesn't
    # support PR decoration (that needs a paid edition), so we only scan on
    # pushes to main/develop rather than on every pull request.
    if: github.event_name == 'push'
    timeout-minutes: 20
    env:
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-do-not-use-outside-tests
      BETTER_AUTH_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:5173
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history so Sonar can attribute issues/blame correctly.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Run backend tests with coverage
        run: npm --prefix backend run test:cov

      - name: SonarQube scan
        id: sonar
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Report quality gate conditions
        if: always() && steps.sonar.outcome != 'skipped'
        continue-on-error: true
        run: node scripts/sonar-quality-gate.mjs
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Upload quality gate diagnostics
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: sonar-quality-gate
          path: .scannerwork/quality-gate.json
          if-no-files-found: ignore

  ui-tests-shard-1:
    name: UI tests (shard 1/2)
    runs-on: ubuntu-latest
    needs: api-tests
    # Two workers on one runner was tried to cut wall-clock time, but several
    # specs render a real WebGL scene with software rendering (swiftshader)
    # and drive a real backend/DB — two Chromium instances sharing one
    # runner's CPU starved both, turning normally-fast assertions into
    # timeouts. Splitting the suite across two independent runners gets the
    # same wall-clock win without that contention, since each shard gets its
    # own CPU. This is two explicit jobs rather than a `strategy: matrix` —
    # this Gitea instance's Actions runner silently drops the whole workflow
    # (no run is even queued) for any push while a job uses `matrix`.
    #
    # Includes installs/builds, the bounded 30-minute Playwright shard, PWA
    # verification (shard 1 only), and artifact upload. Keep this
    # comfortably above the suite's own globalTimeout (playwright.config.ts)
    # so Playwright always gets to exit on its own terms and upload
    # diagnostics rather than being hard-killed by the job deadline.
    timeout-minutes: 50
    env:
      CI: "true"
      TWO_SIDED_LIVE_LOGGING_ENABLED: "true"
      # Neon hosts resolve to several IPv4 and IPv6 addresses and Node gives
      # each only 250ms to connect; from the runners that abandons every IPv4
      # attempt and fails on unreachable IPv6 ("fetch failed"). Covers
      # migrations, Jest, the backend and Playwright in this job.
      NODE_OPTIONS: --network-family-autoselection-attempt-timeout=2500
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-do-not-use-outside-tests
      PORT: "3100"
      BETTER_AUTH_URL: http://localhost:3100
      FRONTEND_URL: http://localhost:5173
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix frontend ci
          npm --prefix backend ci

      # A private database per shard; see the api-tests job.
      - name: Provision isolated test database
        run: node backend/scripts/ci-test-database.mjs create ui_1
        env:
          CI_TEST_DATABASE_BASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      - name: Migrate the test database
        run: npm --prefix backend run db:migrate:test

      - name: Build application for browser tests
        id: browser-build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e:ui -- --shard=1/2 --grep-invert @two-sided-release

      - name: Run production PWA tests
        if: ${{ !cancelled() && steps.browser-build.outcome == 'success' }}
        run: npm run test:e2e:pwa

      - name: Drop isolated test database
        if: always()
        run: node backend/scripts/ci-test-database.mjs drop
        env:
          CI_TEST_DATABASE_BASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      - name: Upload Playwright failure artifacts
        if: failure()
        # v3 is compatible with Gitea's artifact service across more server versions.
        uses: actions/upload-artifact@v3
        with:
          name: playwright-failure-artifacts-1
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  ui-tests-shard-2:
    name: UI tests (shard 2/2)
    runs-on: ubuntu-latest
    needs: api-tests
    timeout-minutes: 50
    env:
      CI: "true"
      TWO_SIDED_LIVE_LOGGING_ENABLED: "true"
      # Neon hosts resolve to several IPv4 and IPv6 addresses and Node gives
      # each only 250ms to connect; from the runners that abandons every IPv4
      # attempt and fails on unreachable IPv6 ("fetch failed"). Covers
      # migrations, Jest, the backend and Playwright in this job.
      NODE_OPTIONS: --network-family-autoselection-attempt-timeout=2500
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-do-not-use-outside-tests
      PORT: "3100"
      BETTER_AUTH_URL: http://localhost:3100
      FRONTEND_URL: http://localhost:5173
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix frontend ci
          npm --prefix backend ci

      # A private database per shard; see the api-tests job.
      - name: Provision isolated test database
        run: node backend/scripts/ci-test-database.mjs create ui_2
        env:
          CI_TEST_DATABASE_BASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      - name: Migrate the test database
        run: npm --prefix backend run db:migrate:test

      - name: Build application for browser tests
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e:ui -- --shard=2/2 --grep-invert @two-sided-release

      - name: Drop isolated test database
        if: always()
        run: node backend/scripts/ci-test-database.mjs drop
        env:
          CI_TEST_DATABASE_BASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-failure-artifacts-2
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  ui-tests-two-sided-release:
    name: UI tests (two-coach release)
    # The four two-browser release scenarios each take ~5 minutes against the
    # real API and database, too long to fit inside a shard's 30-minute budget,
    # so they run in parallel here (tagged @two-sided-release).
    runs-on: ubuntu-latest
    needs: api-tests
    timeout-minutes: 50
    env:
      CI: "true"
      TWO_SIDED_LIVE_LOGGING_ENABLED: "true"
      # Neon hosts resolve to several IPv4 and IPv6 addresses and Node gives
      # each only 250ms to connect; from the runners that abandons every IPv4
      # attempt and fails on unreachable IPv6 ("fetch failed"). Covers
      # migrations, Jest, the backend and Playwright in this job.
      NODE_OPTIONS: --network-family-autoselection-attempt-timeout=2500
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-do-not-use-outside-tests
      PORT: "3100"
      BETTER_AUTH_URL: http://localhost:3100
      FRONTEND_URL: http://localhost:5173
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix frontend ci
          npm --prefix backend ci

      # A private database per shard; see the api-tests job.
      - name: Provision isolated test database
        run: node backend/scripts/ci-test-database.mjs create ui_release
        env:
          CI_TEST_DATABASE_BASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      - name: Migrate the test database
        run: npm --prefix backend run db:migrate:test

      - name: Build application for browser tests
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e:ui -- --grep @two-sided-release

      - name: Drop isolated test database
        if: always()
        run: node backend/scripts/ci-test-database.mjs drop
        env:
          CI_TEST_DATABASE_BASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-failure-artifacts-release
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
