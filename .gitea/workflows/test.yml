name: Test

on:
  pull_request:
    branches: [main, develop, development]
  push:
    branches: [main, develop, development]

jobs:
  quality-and-build:
    name: Code quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix frontend ci
          npm --prefix backend ci

      - name: Lint
        run: npm run lint

      - name: Run frontend model tests
        run: npm --prefix frontend test

      - name: Build
        run: npm run build

  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Neon hosts resolve to several IPv4 and IPv6 addresses and Node gives
      # each only 250ms to connect; from the runners that abandons every IPv4
      # attempt and fails on unreachable IPv6 ("fetch failed"). Covers
      # migrations, Jest, the backend and Playwright in this job.
      NODE_OPTIONS: --network-family-autoselection-attempt-timeout=2500
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-do-not-use-outside-tests
      BETTER_AUTH_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:5173
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Run unit tests
        run: npm test

      - name: Run migration regression tests
        run: npm run test:migrations

      # Every job that touches a database gets its own throwaway one, created
      # next to the TEST_DATABASE_URL database. Runs from different branches
      # and PRs used to share that one database and reset or migrate it under
      # each other mid-run (backend/scripts/ci-test-database.mjs).
      - name: Provision isolated test database
        id: provision
        run: node backend/scripts/ci-test-database.mjs create api
        env:
          CI_TEST_DATABASE_BASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      - name: Run integration tests
        run: npm run test:integration

      # always() covers a failed test step, which is the point, but it covers a
      # cancelled job too - including one the runner dropped before checkout
      # ran, where this script does not exist yet and node exits MODULE_NOT_FOUND,
      # reporting a lost runner connection as a test failure. Gate on the database
      # having actually been created; a run cancelled before that leaves nothing
      # behind that the next create does not sweep.
      - name: Drop isolated test database
        if: always() && steps.provision.outcome == 'success'
        run: node backend/scripts/ci-test-database.mjs drop
        env:
          CI_TEST_DATABASE_BASE_URL: ${{ secrets.TEST_DATABASE_URL }}

  sonarqube:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    # SonarQube Community Edition only analyses a single branch and doesn't
    # support PR decoration (that needs a paid edition), so we only scan on
    # pushes to main/develop rather than on every pull request.
    if: github.event_name == 'push'
    timeout-minutes: 20
    env:
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-do-not-use-outside-tests
      BETTER_AUTH_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:5173
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history so Sonar can attribute issues/blame correctly.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Run backend tests with coverage
        run: npm --prefix backend run test:cov

      - name: SonarQube scan
        id: sonar
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Report quality gate conditions
        if: always() && steps.sonar.outcome != 'skipped'
        continue-on-error: true
        run: node scripts/sonar-quality-gate.mjs
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Upload quality gate diagnostics
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: sonar-quality-gate
          path: .scannerwork/quality-gate.json
          if-no-files-found: ignore

  ui-tests-shard-1:
    name: UI tests (shard 1/4)
    runs-on: ubuntu-latest
    # Keep one browser per job: software WebGL is CPU intensive. Four explicit
    # shards keep the full suite within each job's 30-minute browser budget.
    # Gitea on this instance does not queue workflows using strategy.matrix.
    # Leave time for builds, PWA checks and failure artifact uploads.
    timeout-minutes: 50
    env:
      CI: "true"
      TWO_SIDED_LIVE_LOGGING_ENABLED: "true"
      # Neon hosts resolve to several IPv4 and IPv6 addresses and Node gives
      # each only 250ms to connect; from the runners that abandons every IPv4
      # attempt and fails on unreachable IPv6 ("fetch failed"). Covers
      # migrations, Jest, the backend and Playwright in this job.
      NODE_OPTIONS: --network-family-autoselection-attempt-timeout=2500
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-do-not-use-outside-tests
      PORT: "3100"
      BETTER_AUTH_URL: http://localhost:3100
      FRONTEND_URL: http://localhost:5173
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix frontend ci
          npm --prefix backend ci

      # A private database per shard; see the api-tests job.
      - name: Provision isolated test database
        id: provision
        run: node backend/scripts/ci-test-database.mjs create ui_1
        env:
          CI_TEST_DATABASE_BASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      - name: Migrate the test database
        run: npm --prefix backend run db:migrate:test

      - name: Build application for browser tests
        id: browser-build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e:ui -- --shard=1/4

      - name: Run production PWA tests
        if: ${{ !cancelled() && steps.browser-build.outcome == 'success' }}
        run: npm run test:e2e:pwa

      - name: Drop isolated test database
        if: always() && steps.provision.outcome == 'success'
        run: node backend/scripts/ci-test-database.mjs drop
        env:
          CI_TEST_DATABASE_BASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      - name: Upload Playwright failure artifacts
        if: failure()
        # v3 is compatible with Gitea's artifact service across more server versions.
        uses: actions/upload-artifact@v3
        with:
          name: playwright-failure-artifacts-1
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  ui-tests-shard-2:
