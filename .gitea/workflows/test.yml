      # A private database per shard; see the api-tests job.
      - name: Provision isolated test database
        id: provision
        run: node backend/scripts/ci-test-database.mjs create ui_2
        env:
          CI_TEST_DATABASE_BASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      - name: Migrate the test database
        run: npm --prefix backend run db:migrate:test

      - name: Build application for browser tests
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e:ui -- --shard=2/4

      - name: Drop isolated test database
        if: always() && steps.provision.outcome == 'success'
        run: node backend/scripts/ci-test-database.mjs drop
        env:
