name: Test

on:
  pull_request:
    branches: [main, develop, development]
  push:
    branches: [main, develop, development]

jobs:
  quality-and-build:
    name: Code quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix frontend ci
          npm --prefix backend ci

      - name: Lint
        run: npm run lint

      - name: Run frontend model tests
        run: npm --prefix frontend test

      - name: Build
        run: npm run build

  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-do-not-use-outside-tests
      BETTER_AUTH_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:5173
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Run unit tests
        run: npm test

      - name: Run integration tests
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

  sonarqube:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    needs: api-tests
    # SonarQube Community Edition only analyses a single branch and doesn't
    # support PR decoration (that needs a paid edition), so we only scan on
    # pushes to main/develop rather than on every pull request.
    if: github.event_name == 'push'
    timeout-minutes: 20
    env:
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-do-not-use-outside-tests
      BETTER_AUTH_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:5173
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history so Sonar can attribute issues/blame correctly.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Run backend tests with coverage
        run: npm --prefix backend run test:cov

      - name: SonarQube scan
        id: sonar
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Report quality gate conditions
        if: always() && steps.sonar.outcome != 'skipped'
        continue-on-error: true
        run: node scripts/sonar-quality-gate.mjs
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Upload quality gate diagnostics
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: sonar-quality-gate
          path: .scannerwork/quality-gate.json
          if-no-files-found: ignore

  ui-tests:
    name: UI tests
    runs-on: ubuntu-latest
    needs: api-tests
    # Includes installs/builds, the bounded 34-minute Playwright suite, PWA
    # verification, and artifact upload. The old job deadline killed
    # Playwright mid-test; keep this comfortably above the suite's own
    # globalTimeout (playwright.config.ts) so Playwright always gets to exit
    # on its own terms and upload diagnostics.
    timeout-minutes: 55
    env:
      CI: "true"
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-do-not-use-outside-tests
      PORT: "3100"
      BETTER_AUTH_URL: http://localhost:3100
      FRONTEND_URL: http://localhost:5173
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix frontend ci
          npm --prefix backend ci

      - name: Migrate the test database
        run: npm --prefix backend run db:migrate

      - name: Build application for browser tests
        id: browser-build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e:ui

      - name: Run production PWA tests
        if: ${{ !cancelled() && steps.browser-build.outcome == 'success' }}
        run: npm run test:e2e:pwa

      - name: Upload Playwright failure artifacts
        if: failure()
        # v3 is compatible with Gitea's artifact service across more server versions.
        uses: actions/upload-artifact@v3
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
