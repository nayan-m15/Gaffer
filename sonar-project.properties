# SonarQube project configuration
# Docs: https://docs.sonarsource.com/sonarqube/latest/analyzing-source-code/analysis-parameters/

sonar.projectKey=sport-coaching-tool
sonar.projectName=Sport Coaching Tool

# --- Source layout -----------------------------------------------------
# Backend (NestJS) and frontend (React/Vite) both live under their own
# package directories. Test files are colocated with source, so we point
# sonar.tests at the same roots and let sonar.test.inclusions reclassify
# spec files as test code instead of production code.
sonar.sources=backend/src,frontend/src
sonar.tests=backend/src,backend/test,frontend/src
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts,**/*.test.ts,**/*.test.tsx,**/*.spec.tsx

# --- Exclusions ----------------------------------------------------------
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  backend/drizzle/**,\
  frontend/src/vite-env.d.ts,\
  **/*.d.ts

# Files that are boilerplate/bootstrap or generated and shouldn't count
# against the coverage ratio.
sonar.coverage.exclusions=\
  backend/src/main.ts,\
  backend/src/**/*.module.ts,\
  backend/drizzle/**,\
  frontend/src/main.tsx,\
  frontend/src/vite-env.d.ts

# Duplication noise from generated/db files.
sonar.cpd.exclusions=backend/drizzle/**

# --- Coverage --------------------------------------------------------------
# Produced by `npm --prefix backend run test:cov` (jest's default
# coverageReporters already include lcov).
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=backend/coverage/lcov.info

# --- Misc --------------------------------------------------------------
sonar.sourceEncoding=UTF-8

# Make the CI scan step wait for and fail on a red quality gate, instead of
# just submitting the analysis and reporting success regardless.
sonar.qualitygate.wait=true
